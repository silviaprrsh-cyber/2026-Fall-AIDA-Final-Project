<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="424" viewBox="0 0 1020 424" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">River Discharge Distributions (Historical Screen, Log Scale)</title>
  <desc id="fig-desc">Horizontal quantile plots on a logarithmic discharge axis (m³/s) for Red Deer (05CC002), Dickson Dam (05CB007), Little Red Deer (05CB001), and Medicine River (05CC007). All four stations are strongly right-skewed: Red Deer median is 22.3 m³/s versus mean 36.0 m³/s and max 284.0 m³/s.</desc>
  <style>
    text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; fill: #1F2937; }
    .title { font-size: 18px; font-weight: 700; }
    .subtitle { font-size: 12px; fill: #4B5563; }
    .axis-title { font-size: 12px; font-weight: 600; fill: #1F2937; }
    .tick { font-size: 11px; fill: #374151; }
    .label { font-size: 11px; font-weight: 600; }
    .small { font-size: 10px; fill: #4B5563; }
    .footer { font-size: 10px; fill: #6B7280; }
  </style>
  <rect x="0" y="0" width="1020" height="424" fill="#FFFFFF" />
  <text x="24" y="34" class="title">Figure 2. Skewed River Discharge Distributions (Historical Screen)</text>
  <text x="24" y="54" class="subtitle">Log10 scale in m³/s showing Min–Max whiskers, P10–P90 bar, P25–P75 IQR box, Median line, and Mean diamond. Mean exceeds median at every station due to rare high-flow tails.</text>
