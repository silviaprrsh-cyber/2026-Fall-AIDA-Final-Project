<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Formal Sensitivity Analyses P-S1 (Strict Final Approval) and P-S2 (Sylvan Lake Missingness)</title>
  <desc id="fig-desc">Two-panel figure. Panel A compares cohort sizes: river-only all dates (144,289 rows, 541 days), river-only on shared lake dates (95,718 rows, 361 days), lake-complete (95,053 rows, 361 days), and strict all-Final P-S1 (0 rows). Panel B plots weekly 7-day mean Red Deer discharge across 79 blocks, highlighting the 6-month winter lake gap where 48,571 river-only timestamps would be dropped.</desc>
  <style>
    text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; fill: #1F2937; }
    .title { font-size: 18px; font-weight: 700; }
    .subtitle { font-size: 12px; fill: #4B5563; }
    .axis-title { font-size: 12px; font-weight: 600; fill: #1F2937; }
    .tick { font-size: 11px; fill: #374151; }
    .label { font-size: 11px; font-weight: 600; }
    .small { font-size: 10px; fill: #4B5563; }
    .footer { font-size: 10px; fill: #6B7280; }
  </style>
  <rect x="0" y="0" width="1080" height="520" fill="#FFFFFF" />
  <text x="24" y="34" class="title">Figure 4. Sensitivity Analyses: Approval Rule (P-S1) and Lake Missingness (P-S2)</text>
  <text x="24" y="54" class="subtitle">How data-inclusion rules alter sample coverage versus same-date Red Deer (05CC002) discharge summaries.</text>
  <rect x="24" y="74" width="1032" height="166" rx="6" fill="#F9FAFB" stroke="#E5E7EB" />
  <text x="38" y="96" class="axis-title">Panel A. Cohort Denominators Under Changed Inclusion Rules (Exact 5-Minute UTC Timestamps)</text>
  <text x="285" y="126" text-anchor="end" class="label">River-only, all dates (main cohort)</text>
  <rect x="295" y="114" width="452.1" height="18" rx="3" fill="#0072B2" />
  <text x="755.1" y="127" class="small" style="font-weight:600;fill:#1F2937;">144,289  (541 UTC days)</text>
  <text x="285" y="156" text-anchor="end" class="label">River-only, shared lake dates (P-S2 ref)</text>
  <rect x="295" y="144" width="299.9" height="18" rx="3" fill="#56B4E9" />
  <text x="602.9" y="157" class="small" style="font-weight:600;fill:#1F2937;">95,718  (361 UTC days · mean 39.704 m³/s)</text>
  <text x="285" y="186" text-anchor="end" class="label">Lake-complete, 5 stations (P-S2 alt)</text>
  <rect x="295" y="174" width="297.8" height="18" rx="3" fill="#009E73" />
  <text x="600.8" y="187" class="small" style="font-weight:600;fill:#1F2937;">95,053  (361 UTC days · mean 39.827 m³/s (+0.123))</text>
  <text x="285" y="216" text-anchor="end" class="label">Strict All-Final, 9 values (P-S1 alt)</text>
  <rect x="295" y="204" width="3.0" height="18" rx="3" fill="#D55E00" />
  <text x="306.0" y="217" class="small" style="font-weight:600;fill:#1F2937;">0  (0 UTC days · 05CB001 &amp; 05CC007 have 0 Final rows)</text>
  <rect x="24" y="256" width="1032" height="224" rx="6" fill="#F9FAFB" stroke="#E5E7EB" />
  <text x="38" y="278" class="axis-title">Panel B. Weekly 7-Day Mean Red Deer Discharge Across All 79 UTC Blocks — Shaded Band Shows Winter Sylvan Lake Gap</text>
