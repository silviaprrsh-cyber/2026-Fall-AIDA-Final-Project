<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Lagged Upstream-to-Red-Deer Discharge Correlation with 95% 7-Day Block Intervals</title>
  <desc id="fig-desc">Line plot with error bars showing Pearson r between upstream discharge Q(t-lag) and Red Deer 05CC002 Q(t) across lags 0, 6, 12, 24, 30, and 48 hours, with 95% seven-day UTC block bootstrap intervals. Dickson stays near 0.91–0.95 (flat peak at 12 h), Little Red Deer peaks near 0.726 at 30 h, and Medicine shows a wide interval (0.25–0.81) rising to the 48 h boundary.</desc>
  <style>
    text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; fill: #1F2937; }
    .title { font-size: 18px; font-weight: 700; }
    .subtitle { font-size: 12px; fill: #4B5563; }
    .axis-title { font-size: 12px; font-weight: 600; fill: #1F2937; }
    .tick { font-size: 11px; fill: #374151; }
    .label { font-size: 11px; font-weight: 600; }
    .small { font-size: 10px; fill: #4B5563; }
    .footer { font-size: 10px; fill: #6B7280; }
  </style>
