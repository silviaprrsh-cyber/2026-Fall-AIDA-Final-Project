  <text x="752" y="300" class="small">• Shared seasonality &amp; persistence</text>
  <text x="752" y="315" class="small">  flatten lag curves.</text>
  <text x="752" y="330" class="small">• Intervals overlap across lags.</text>
  <text x="752" y="345" class="small">• Not a verified flood travel time</text>
  <text x="752" y="360" class="small">  or operational warning lead.</text>
